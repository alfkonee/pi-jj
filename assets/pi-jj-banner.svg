<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">pi-jj banner</title>
  <desc id="desc">Conceptual banner with an agent core, checkpoint flow, and stacked PR layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08192d" />
      <stop offset="52%" stop-color="#102b4a" />
      <stop offset="100%" stop-color="#1b3e5f" />
    </linearGradient>
    <radialGradient id="wash" cx="38%" cy="18%" r="88%">
      <stop offset="0%" stop-color="#93f1ff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#93f1ff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#81eaff" />
      <stop offset="45%" stop-color="#72ffd9" />
      <stop offset="100%" stop-color="#8fff97" />
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c3b60" />
      <stop offset="100%" stop-color="#112d4a" />
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#051022" flood-opacity="0.55" />
    </filter>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)" />
  <rect width="1200" height="320" fill="url(#wash)" />

  <g opacity="0.2" stroke="url(#accent)" stroke-width="1.6" fill="none">
    <path d="M-10 72h250l34 25h176" />
    <path d="M4 247h228l26-19h161" />
    <path d="M760 44h170l18 16h252" />
    <path d="M740 281h190l16-14h240" />
  </g>

  <g transform="translate(148 92)" filter="url(#softShadow)">
    <circle cx="86" cy="70" r="64" fill="#0f2f4f" stroke="#74e9ff" stroke-opacity="0.55" stroke-width="3" />
    <circle cx="86" cy="70" r="36" fill="#14456c" />
    <circle cx="86" cy="70" r="16" fill="#8efce3" />
    <path d="M86 6v24M86 110v24M22 70h24M126 70h24" stroke="#8fefff" stroke-width="3" stroke-linecap="round" opacity="0.9" />
    <path d="M41 25l17 17M114 98l17 17M41 115l17-17M114 42l17-17" stroke="#79ffd2" stroke-width="2.6" stroke-linecap="round" opacity="0.75" />
    <circle cx="86" cy="70" r="84" fill="none" stroke="#76e8ff" stroke-opacity="0.3" stroke-dasharray="3 10" />
  </g>

  <g transform="translate(364 26)" opacity="0.25" filter="url(#blur)">
    <ellipse cx="262" cy="130" rx="210" ry="86" fill="#83f0ff" />
  </g>

  <g transform="translate(350 112)">
    <path d="M0 38h74l34-22h58l26-16h66l24 20h60" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="38" r="8" fill="#74ffe4" />
    <circle cx="108" cy="16" r="8" fill="#7de9ff" />
    <circle cx="192" cy="0" r="8" fill="#8dffbc" />
    <circle cx="282" cy="20" r="8" fill="#7fefff" />
    <circle cx="342" cy="20" r="8" fill="#89ffa9" />
    <path d="M108 16v62M192 0v78M282 20v58" stroke="#9fdfff" stroke-opacity="0.33" stroke-width="2" stroke-dasharray="3 8" />
  </g>

  <g transform="translate(822 70)" filter="url(#softShadow)">
    <rect x="8" y="18" width="260" height="158" rx="18" fill="url(#plate)">
      <animate attributeName="opacity" values="0.9;0.82;0.9" dur="5s" repeatCount="indefinite" />
    </rect>
    <rect x="20" y="8" width="260" height="158" rx="18" fill="url(#plate)" stroke="#70e7ff" stroke-opacity="0.35" />
    <rect x="32" y="0" width="260" height="158" rx="18" fill="url(#plate)" stroke="#84ffc0" stroke-opacity="0.6" />
    <path d="M64 44h104M64 72h144M64 100h118" stroke="#9de8ff" stroke-width="6" stroke-linecap="round" opacity="0.75" />
    <circle cx="248" cy="44" r="10" fill="#0f4768" stroke="#8df5cc" />
    <circle cx="248" cy="72" r="10" fill="#0f4768" stroke="#8df5cc" />
    <circle cx="248" cy="100" r="10" fill="#0f4768" stroke="#8df5cc" />
  </g>

  <g transform="translate(420 256)">
    <text x="0" y="0" fill="#e9f7ff" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="48" font-weight="800" letter-spacing="1.2">pi-jj</text>
  </g>
</svg>
